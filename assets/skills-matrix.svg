<svg width="100%" height="auto" viewBox="0 0 960 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skills-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c0f"/>
      <stop offset="50%" stop-color="#0e1318"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <pattern id="skills-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141a22" stroke-width="0.5"/>
    </pattern>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }

      /* Bus data flow animation */
      @keyframes bus-data {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      .bus-stream {
        stroke-dasharray: 8 4 2 4;
        animation: bus-data 2.5s linear infinite;
      }

      /* Active skill node pulse */
      @keyframes skill-ping {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .s-node {
        animation: skill-ping 2.4s ease-in-out infinite;
      }

      /* XR pulse wave */
      @keyframes xr-ping {
        0% { r: 3px; opacity: 1; stroke-width: 1px; }
        100% { r: 9px; opacity: 0; stroke-width: 0.5px; }
      }
      .xr-wave {
        animation: xr-ping 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
        transform-origin: 432px 105px;
      }
    </style>
  </defs>

  <rect width="960" height="250" rx="10" fill="url(#skills-bg)"/>
  <rect width="960" height="250" rx="10" fill="url(#skills-grid)" opacity="0.75"/>
  <rect x="0.5" y="0.5" width="959" height="249" rx="9.5" stroke="#1f2834" stroke-width="1"/>

  <!-- Left Accent -->
  <line x1="1" y1="20" x2="1" y2="230" stroke="#7ea172" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g class="mono" font-size="10" fill="#586777" letter-spacing="0.08em">
    <text x="36" y="34" fill="#8da381" font-weight="700">SYSTEM // TECHNICAL CAPABILITIES</text>
    <text x="245" y="34" fill="#2d3744">|</text>
    <text x="260" y="34">ENGINE ARCHITECTURE &amp; TOOLING</text>
    <text x="500" y="34" fill="#2d3744">|</text>
    <text x="515" y="34" fill="#7ea172">ALL MODULES VERIFIED</text>
  </g>
  <line x1="36" y1="46" x2="924" y2="46" stroke="#17202b" stroke-width="1"/>

  <!-- 3 Distinct Technical Panels -->

  <!-- PANEL 1: GAME DEVELOPMENT -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="340" height="150" rx="6" fill="#0b0f14" stroke="#1a2430" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="340" height="28" rx="6" fill="#0f141a"/>
    <circle cx="16" cy="14" r="3" fill="#7ea172"/>
    <text x="28" y="18" class="mono" font-size="10" font-weight="700" fill="#8da381" letter-spacing="0.06em">GAME DEVELOPMENT &amp; SYSTEMS</text>

    <!-- Skills List -->
    <g class="mono" font-size="10.5" fill="#cbd5e1">
      <g transform="translate(16, 46)">
        <circle class="s-node" cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Unity Engine (3D &amp; URP Pipeline)</text>
      </g>
      <g transform="translate(16, 68)">
        <circle class="s-node" cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">C# Systems &amp; Gameplay Scripting</text>
      </g>
      <g transform="translate(16, 90)">
        <circle class="s-node" cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Player Movement &amp; Camera Systems</text>
      </g>
      <g transform="translate(16, 112)">
        <circle class="s-node" cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Animation Controllers &amp; Blend Trees</text>
      </g>
      <g transform="translate(16, 134)">
        <circle class="s-node" cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Gameplay Mechanics &amp; UI Loops</text>
      </g>
    </g>
  </g>

  <!-- PANEL 2: CURRENTLY EXPLORING (XR) -->
  <g transform="translate(390, 60)">
    <rect x="0" y="0" width="250" height="150" rx="6" fill="#0b100d" stroke="#1a2b20" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#0f1813"/>
    <circle cx="16" cy="14" r="3" fill="#7ea172"/>
    <text x="28" y="18" class="mono" font-size="10" font-weight="700" fill="#8da381" letter-spacing="0.06em">CURRENTLY EXPLORING</text>

    <!-- Radar wave -->
    <circle class="xr-wave" cx="42" cy="58" r="3" fill="none" stroke="#7ea172"/>

    <!-- Skills List -->
    <g class="mono" font-size="10.5" fill="#cbd5e1">
      <g transform="translate(16, 56)">
        <circle cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Extended Reality (XR)</text>
      </g>
      <g transform="translate(16, 84)">
        <circle cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Immersive Experiences</text>
      </g>
      <g transform="translate(16, 112)">
        <circle cx="4" cy="-3" r="2.5" fill="#7ea172"/>
        <text x="14" y="0">Spatial UI &amp; Interactions</text>
      </g>
      <g transform="translate(16, 136)">
        <rect x="0" y="-12" width="218" height="20" rx="3" fill="#121e15" stroke="#233827" stroke-width="1"/>
        <text x="8" y="1" font-size="9" fill="#8da381" font-weight="600">R&amp;D STATUS: ACTIVE STUDY</text>
      </g>
    </g>
  </g>

  <!-- PANEL 3: DEVELOPMENT TOOLS -->
  <g transform="translate(654, 60)">
    <rect x="0" y="0" width="270" height="150" rx="6" fill="#0b0f14" stroke="#1a2430" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="270" height="28" rx="6" fill="#0f141a"/>
    <circle cx="16" cy="14" r="3" fill="#586e84"/>
    <text x="28" y="18" class="mono" font-size="10" font-weight="700" fill="#9daab8" letter-spacing="0.06em">DEVELOPMENT TOOLS</text>

    <!-- Skills List -->
    <g class="mono" font-size="10.5" fill="#cbd5e1">
      <g transform="translate(16, 50)">
        <circle cx="4" cy="-3" r="2.5" fill="#f05032"/>
        <text x="14" y="0">Git Version Control</text>
      </g>
      <g transform="translate(16, 74)">
        <circle cx="4" cy="-3" r="2.5" fill="#f0f6fc"/>
        <text x="14" y="0">GitHub Collaboration</text>
      </g>
      <g transform="translate(16, 98)">
        <circle cx="4" cy="-3" r="2.5" fill="#c586c0"/>
        <text x="14" y="0">Visual Studio</text>
      </g>
      <g transform="translate(16, 122)">
        <circle cx="4" cy="-3" r="2.5" fill="#007acc"/>
        <text x="14" y="0">Visual Studio Code</text>
      </g>
    </g>
  </g>

  <!-- Bottom Animated System Bus Stream -->
  <line class="bus-stream" x1="36" y1="228" x2="924" y2="228" stroke="#7ea172" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
