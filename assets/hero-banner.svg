<svg width="100%" height="auto" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </linearGradient>
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ea172" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ea172" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ea172" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ea172" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8da381" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ea172" stop-opacity="0"/>
    </linearGradient>
    <pattern id="engine-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#151a22" stroke-width="0.7"/>
      <circle cx="30" cy="0" r="0.8" fill="#1e2632"/>
    </pattern>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }

      /* Beacon ripple */
      @keyframes ripple-wave {
        0% { r: 3.5px; opacity: 0.9; stroke-width: 1px; }
        100% { r: 11px; opacity: 0; stroke-width: 0.5px; }
      }
      .beacon-ripple {
        animation: ripple-wave 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
        transform-origin: 760px 40px;
      }

      /* Viewport scanline */
      @keyframes scan-sweep {
        0% { transform: translateY(-30px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(195px); opacity: 0; }
      }
      .scanline {
        animation: scan-sweep 5s ease-in-out infinite;
      }

      /* Profiler wave pulse */
      @keyframes profiler-stream {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .profiler-line {
        stroke-dasharray: 6 3 12 4 8 2;
        animation: profiler-stream 8s linear infinite;
      }

      /* Compass ring slow rotation */
      @keyframes rotate-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .orbit-ring {
        animation: rotate-ring 24s linear infinite;
        transform-origin: 122px 106px;
      }

      /* Cursor blink */
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .blinker {
        animation: cursor-blink 1s steps(2, start) infinite;
      }

      /* Floating vertex nodes */
      @keyframes vertex-float-1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(3px, -4px); }
      }
      @keyframes vertex-float-2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-3px, 3px); }
      }
      .v-node-1 { animation: vertex-float-1 4s ease-in-out infinite; }
      .v-node-2 { animation: vertex-float-2 4.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="300" rx="12" fill="url(#bg-grad)"/>
  <rect width="960" height="300" rx="12" fill="url(#engine-grid)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="959" height="299" rx="11.5" stroke="#1f2631" stroke-width="1"/>

  <!-- Top Engine Viewport Bar -->
  <line x1="24" y1="58" x2="936" y2="58" stroke="#1a212b" stroke-width="1"/>
  <line x1="24" y1="58" x2="240" y2="58" stroke="#7ea172" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Viewport HUD Indicators -->
  <g class="mono" font-size="10" fill="#5c6a7a" letter-spacing="0.08em">
    <text x="32" y="42">ENGINE: UNITY 3D</text>
    <text x="175" y="42" fill="#2d3744">|</text>
    <text x="195" y="42">RENDER: URP</text>
    <text x="295" y="42" fill="#2d3744">|</text>
    <text x="315" y="42">FOV: 60°</text>
    <text x="390" y="42" fill="#2d3744">|</text>
    <text x="410" y="42">COORD: [X: 0.00 Y: 1.00 Z: 0.00]<tspan class="blinker" fill="#7ea172">_</tspan></text>
  </g>

  <!-- Live Status Beacon (Top Right) -->
  <g class="sans">
    <rect x="742" y="28" width="188" height="24" rx="12" fill="#101712" stroke="#243825" stroke-width="1"/>
    <!-- Expanding ripple ring -->
    <circle class="beacon-ripple" cx="760" cy="40" r="3.5" fill="none" stroke="#7ea172"/>
    <!-- Center solid light -->
    <circle cx="760" cy="40" r="3.5" fill="#7ea172"/>
    <text x="772" y="44" class="mono" font-size="9.5" font-weight="600" fill="#99b88e" letter-spacing="0.06em">STATUS: CREATING WORLDS</text>
  </g>

  <!-- Main Hero Content -->
  <!-- Discipline Badge -->
  <g class="mono">
    <rect x="36" y="86" width="186" height="22" rx="4" fill="#131d14" stroke="#273d29" stroke-width="1"/>
    <text x="46" y="101" font-size="10.5" font-weight="600" fill="#8da381" letter-spacing="0.1em">ASPIRING GAME DEVELOPER</text>
  </g>

  <!-- Name -->
  <text x="34" y="156" class="sans" font-size="44" font-weight="800" fill="#f0f6fc" letter-spacing="-0.02em">AJISH</text>

  <!-- Professional Subtitle -->
  <text x="36" y="188" class="sans" font-size="16" font-weight="600" fill="#cbd5e1" letter-spacing="0.01em">
    Unity &amp; C# Gameplay Systems <tspan fill="#7ea172">·</tspan> Interactive 3D <tspan fill="#7ea172">·</tspan> Exploring XR
  </text>

  <!-- Editorial Subtext -->
  <text x="36" y="215" class="sans" font-size="13" fill="#7c8a99" font-weight="400">
    Focusing on gameplay mechanics, character systems, and immersive virtual environments.
  </text>

  <!-- Technical Pill Chips (Bottom Left) -->
  <g class="mono" font-size="10.5">
    <rect x="36" y="244" width="76" height="24" rx="4" fill="#13171d" stroke="#232a34" stroke-width="1"/>
    <text x="50" y="260" fill="#9ba8b8">UNITY</text>

    <rect x="120" y="244" width="56" height="24" rx="4" fill="#13171d" stroke="#232a34" stroke-width="1"/>
    <text x="136" y="260" fill="#9ba8b8">C#</text>

    <rect x="184" y="244" width="128" height="24" rx="4" fill="#13171d" stroke="#232a34" stroke-width="1"/>
    <text x="198" y="260" fill="#9ba8b8">3D GAMEPLAY</text>

    <rect x="320" y="244" width="126" height="24" rx="4" fill="#141e16" stroke="#273a2a" stroke-width="1"/>
    <circle cx="334" cy="256" r="3" fill="#7ea172"/>
    <text x="344" y="260" fill="#8da381" font-weight="600">EXPLORING XR</text>
  </g>

  <!-- Right Visual: 3D Engine Viewport Gizmo & Wireframe Representation -->
  <g transform="translate(680, 80)">
    <!-- Viewport Frame -->
    <rect x="0" y="0" width="245" height="190" rx="8" fill="#0a0d10" fill-opacity="0.85" stroke="#1d242e" stroke-width="1"/>

    <!-- Dynamic Scanline Sweep across Viewport -->
    <g clip-path="url(#vp-clip)">
      <clipPath id="vp-clip">
        <rect x="1" y="1" width="243" height="188" rx="7"/>
      </clipPath>
      <rect class="scanline" x="1" y="0" width="243" height="30" fill="url(#scan-grad)"/>
    </g>

    <!-- Coordinate Origin Crosshair -->
    <line x1="20" y1="95" x2="225" y2="95" stroke="#151b22" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="122" y1="15" x2="122" y2="175" stroke="#151b22" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Rotating Orientation Compass Ring -->
    <circle class="orbit-ring" cx="122" cy="106" r="48" fill="none" stroke="#222b36" stroke-width="0.8" stroke-dasharray="3 9 1 9"/>

    <!-- Wireframe Isometric Cube / Spatial Bounds -->
    <path d="M 122 42 L 182 66 L 182 130 L 122 154 L 62 130 L 62 66 Z" fill="none" stroke="#202934" stroke-width="1"/>
    <line x1="122" y1="42" x2="122" y2="106" stroke="#273240" stroke-width="1"/>
    <line x1="62" y1="66" x2="122" y2="106" stroke="#273240" stroke-width="1"/>
    <line x1="182" y1="66" x2="122" y2="106" stroke="#273240" stroke-width="1"/>
    <line x1="122" y1="106" x2="122" y2="154" stroke="#273240" stroke-width="1"/>

    <!-- Floating Vertices -->
    <circle class="v-node-1" cx="182" cy="66" r="2.5" fill="#7ea172"/>
    <circle class="v-node-2" cx="62" cy="130" r="2.5" fill="#5e81ac"/>
    <circle class="v-node-1" cx="122" cy="42" r="2.5" fill="#bf616a"/>

    <!-- 3D Transform Gizmo at Center (122, 106) -->
    <!-- Z axis (Blue / Slate) -->
    <line x1="122" y1="106" x2="80" y2="126" stroke="#5e81ac" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="76,128 85,123 83,131" fill="#5e81ac"/>
    <text x="68" y="138" class="mono" font-size="10" font-weight="700" fill="#5e81ac">Z</text>

    <!-- X axis (Red / Salmon) -->
    <line x1="122" y1="106" x2="168" y2="126" stroke="#bf616a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="172,128 165,131 163,123" fill="#bf616a"/>
    <text x="178" y="138" class="mono" font-size="10" font-weight="700" fill="#bf616a">X</text>

    <!-- Y axis (Muted Sage Green - Engine Up) -->
    <line x1="122" y1="106" x2="122" y2="52" stroke="#7ea172" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="122,46 118,56 126,56" fill="#7ea172"/>
    <text x="126" y="44" class="mono" font-size="10" font-weight="700" fill="#7ea172">Y</text>

    <!-- Center Pivot Node with subtle pulse -->
    <circle cx="122" cy="106" r="3.5" fill="#f0f6fc"/>
    <circle cx="122" cy="106" r="6" fill="none" stroke="#7ea172" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Profiler Telemetry Graph / Status Strip -->
    <rect x="12" y="160" width="221" height="20" rx="4" fill="#0d1115" stroke="#182029" stroke-width="1"/>
    <!-- Animated Profiler Line -->
    <path class="profiler-line" d="M 16 170 Q 30 166 45 171 T 75 168 T 105 172" fill="none" stroke="#7ea172" stroke-width="1" stroke-opacity="0.6"/>
    <text x="115" y="174" class="mono" font-size="8.5" fill="#586777">URP</text>
    <text x="145" y="174" class="mono" font-size="8.5" fill="#7ea172">60.0 FPS · 16.6ms</text>
  </g>
</svg>
