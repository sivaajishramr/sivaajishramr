<svg width="100%" height="auto" viewBox="0 0 960 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; }
      @keyframes foot-beacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      .foot-dot {
        animation: foot-beacon 2.5s ease-in-out infinite;
        transform-origin: 36px 52px;
      }
    </style>
  </defs>

  <line x1="0" y1="1" x2="960" y2="1" stroke="#1a2129" stroke-width="1"/>
  
  <g class="mono" font-size="10" fill="#526070" letter-spacing="0.1em">
    <text x="36" y="38">AJISH // GAME DEVELOPER PORTFOLIO</text>
    <text x="480" y="38" text-anchor="middle" fill="#7ea172">UNITY · C# · EXPLORING XR</text>
    <text x="924" y="38" text-anchor="end">BUILD VERSION 2.0</text>
  </g>

  <circle class="foot-dot" cx="36" cy="52" r="2.5" fill="#7ea172"/>
  <text x="46" y="55" class="mono" font-size="8.5" fill="#677869">RUNTIME: ACTIVE &amp; OPEN TO COLLABORATION</text>
</svg>
