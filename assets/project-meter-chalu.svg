<svg width="100%" height="auto" viewBox="0 0 960 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="60%" stop-color="#12161b"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <pattern id="p1-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161c22" stroke-width="0.6"/>
    </pattern>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="960" height="240" rx="10" fill="url(#p1-bg)"/>
  <rect width="960" height="240" rx="10" fill="url(#p1-grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="959" height="239" rx="9.5" stroke="#222a36" stroke-width="1"/>

  <!-- Left Accent Line -->
  <line x1="1" y1="20" x2="1" y2="220" stroke="#c89b53" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g class="mono" font-size="10" fill="#677584" letter-spacing="0.08em">
    <text x="36" y="34" fill="#c89b53" font-weight="700">PROJECT 01</text>
    <text x="120" y="34" fill="#2d3744">|</text>
    <text x="135" y="34">GENRE: RURAL DRIVING SIMULATOR</text>
    <text x="375" y="34" fill="#2d3744">|</text>
    <text x="390" y="34">PLATFORM: MOBILE / ANDROID</text>
    <text x="585" y="34" fill="#2d3744">|</text>
    <text x="600" y="34" fill="#8da381">ROLE: GAMEPLAY &amp; INTERACTION SYSTEMS</text>
  </g>
  <line x1="36" y1="46" x2="924" y2="46" stroke="#1c232e" stroke-width="1"/>

  <!-- Left Content -->
  <text x="36" y="86" class="sans" font-size="28" font-weight="800" fill="#f0f6fc" letter-spacing="-0.01em">
    METER CHALU
  </text>
  <text x="36" y="112" class="sans" font-size="14" font-weight="500" fill="#a4b3c4">
    Rural Driving Gameplay, Passenger Interactions &amp; Economy Mechanics
  </text>

  <!-- Key Implemented Mechanics -->
  <g class="sans" font-size="12" fill="#7a8999">
    <text x="36" y="146">
      <tspan fill="#7ea172">▸</tspan> Driving physics &amp; vehicle controls: acceleration, braking &amp; horn
    </text>
    <text x="36" y="168">
      <tspan fill="#7ea172">▸</tspan> Passenger interaction systems, fare calculation &amp; bargaining logic
    </text>
    <text x="36" y="190">
      <tspan fill="#7ea172">▸</tspan> Objective-based missions, progression saves &amp; mobile gameplay HUD
    </text>
  </g>

  <!-- Tags Pill Bar -->
  <g class="mono" font-size="9.5">
    <rect x="36" y="206" width="70" height="20" rx="3" fill="#141920" stroke="#232d3a" stroke-width="1"/>
    <text x="47" y="220" fill="#8da381">UNITY 3D</text>

    <rect x="112" y="206" width="40" height="20" rx="3" fill="#141920" stroke="#232d3a" stroke-width="1"/>
    <text x="123" y="220" fill="#9daab8">C#</text>

    <rect x="158" y="206" width="124" height="20" rx="3" fill="#141920" stroke="#232d3a" stroke-width="1"/>
    <text x="168" y="220" fill="#9daab8">VEHICLE CONTROLS</text>

    <rect x="288" y="206" width="134" height="20" rx="3" fill="#141920" stroke="#232d3a" stroke-width="1"/>
    <text x="298" y="220" fill="#9daab8">PASSENGER SYSTEM</text>

    <rect x="428" y="206" width="100" height="20" rx="3" fill="#141920" stroke="#232d3a" stroke-width="1"/>
    <text x="439" y="220" fill="#9daab8">MOBILE HUD</text>
  </g>

  <!-- Right Side: Driving HUD & Telemetry Schematic -->
  <g transform="translate(685, 60)">
    <!-- Dashboard Frame -->
    <rect x="0" y="0" width="240" height="156" rx="8" fill="#0d1115" stroke="#202934" stroke-width="1"/>

    <!-- Rural Road Perspective -->
    <path d="M 50 148 L 110 92 L 130 92 L 190 148 Z" fill="#121820" stroke="#1d2632" stroke-width="1"/>
    <!-- Center Road Dashes -->
    <line x1="120" y1="94" x2="120" y2="104" stroke="#c89b53" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="120" y1="110" x2="120" y2="126" stroke="#c89b53" stroke-width="2"/>
    <line x1="120" y1="132" x2="120" y2="148" stroke="#c89b53" stroke-width="2.5"/>

    <!-- Speedometer Dial Arc -->
    <path d="M 30 76 A 35 35 0 0 1 90 76" fill="none" stroke="#212a36" stroke-width="4" stroke-linecap="round"/>
    <path d="M 30 76 A 35 35 0 0 1 78 48" fill="none" stroke="#7ea172" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="68" class="mono" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">54</text>
    <text x="60" y="80" class="mono" font-size="8" fill="#657383" text-anchor="middle">KM/H</text>

    <!-- Digital Fare Meter Box -->
    <rect x="125" y="24" width="102" height="42" rx="4" fill="#090d10" stroke="#283525" stroke-width="1"/>
    <text x="133" y="38" class="mono" font-size="8.5" fill="#677a64">FARE METER</text>
    <text x="133" y="58" class="mono" font-size="16" font-weight="700" fill="#8da381">₹ 145.00</text>

    <!-- Interactive Status Readouts -->
    <g class="mono" font-size="8.5" fill="#8c9aa8">
      <!-- Passenger Status -->
      <rect x="12" y="96" width="88" height="18" rx="3" fill="#12171e" stroke="#1b2430" stroke-width="1"/>
      <circle cx="20" cy="105" r="2.5" fill="#7ea172"/>
      <text x="27" y="108">RIDER: ACTIVE</text>

      <!-- Horn / Audio Trigger -->
      <rect x="12" y="122" width="88" height="18" rx="3" fill="#12171e" stroke="#1b2430" stroke-width="1"/>
      <text x="19" y="134">HORN: READY</text>
    </g>

    <!-- Bargain HUD Badge -->
    <rect x="135" y="110" width="92" height="30" rx="4" fill="#181c15" stroke="#33422d" stroke-width="1"/>
    <text x="143" y="123" class="mono" font-size="8" fill="#8da381">BARGAIN SYSTEM</text>
    <text x="143" y="135" class="mono" font-size="9" font-weight="600" fill="#c8d7b9">ACCEPTED: 100%</text>
  </g>
</svg>
