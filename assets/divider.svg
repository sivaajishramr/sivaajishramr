<svg width="100%" height="auto" viewBox="0 0 960 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="div-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ea172" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8da381" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7ea172" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes beam-pass {
        0% { transform: translateX(-150px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(960px); opacity: 0; }
      }
      .luminous-pulse {
        animation: beam-pass 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes diamond-pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .diamond-node {
        animation: diamond-pulse 3s ease-in-out infinite;
        transform-origin: 480px 12px;
      }
    </style>
  </defs>

  <!-- Static Base Lines -->
  <line x1="0" y1="12" x2="450" y2="12" stroke="#1d2530" stroke-width="1"/>
  <line x1="450" y1="12" x2="466" y2="12" stroke="#7ea172" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Center Diamond Crosshair -->
  <polygon class="diamond-node" points="480,7 485,12 480,17 475,12" fill="#131b14" stroke="#7ea172" stroke-width="1.2"/>
  <circle cx="480" cy="12" r="1.5" fill="#f0f6fc"/>

  <line x1="494" y1="12" x2="510" y2="12" stroke="#7ea172" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="510" y1="12" x2="960" y2="12" stroke="#1d2530" stroke-width="1"/>

  <!-- Traveling Energy Beam -->
  <rect class="luminous-pulse" x="0" y="11" width="120" height="2" fill="url(#div-beam)"/>
</svg>
